# Tiny Tapeout project information
project:
  title:        "GlucoSense GS-1 digital core"      # Project title
  author:       "Asif Mehmood"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Wearable glucose sensor digital core: sigma-delta ADC filter, HEC pancreatic islet model, BLE advertising baseband, UART"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     8000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "4x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_asifmehmood_glucosense"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "SD_IN sigma-delta modulator bit stream"
  ui[1]: "UART_RX commands"
  ui[2]: "ADV_EN enable BLE advertising"
  ui[3]: "BIST_EN use on-chip test modulator"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "UART_TX measurement frames"
  uo[1]: "BB_DATA BLE bit stream 1 Mbit/s"
  uo[2]: "BB_EN packet on air"
  uo[3]: "PLL_EN synthesiser enable"
  uo[4]: "SD_CLK modulator clock 250 kHz"
  uo[5]: "SD_RST modulator reset"
  uo[6]: "AFE_EN analog front end enable"
  uo[7]: "DRDY frame being sent"

  # Bidirectional pins
  uio[0]: "AMUX0 analog input select"
  uio[1]: "AMUX1 analog input select"
  uio[2]: "RF_CH0 advertising channel"
  uio[3]: "RF_CH1 advertising channel"
  uio[4]: "BIAS2 sensor bias DAC"
  uio[5]: "BIAS3 sensor bias DAC"
  uio[6]: "BIAS4 sensor bias DAC"
  uio[7]: "BIAS5 sensor bias DAC"

# Do not change!
yaml_version: 6
